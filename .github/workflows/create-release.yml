name: create-release

on:
  # Create a stable release
  push:
    tags:
      - 'v*'
  # Create a preview release
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

env:
  PREFIX: /tmp/build

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      is_preview: ${{ steps.meta.outputs.is_preview }}
      tmux_version: ${{ steps.meta.outputs.tmux_version }}
      tmux_reported_version: ${{ steps.meta.outputs.tmux_reported_version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      upstream_changed: ${{ steps.check_changes.outputs.upstream_changed }}
      upstream_head_sha: ${{ steps.tmux_head.outputs.upstream_head_sha }}
    steps:
      - name: Compute metadata
        id: meta
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              VERSION=3.8
              echo "is_preview=false"
              echo "tmux_version=$VERSION"
              echo "tmux_reported_version=$VERSION-0+$GITHUB_REPOSITORY_OWNER"
              ;;
            push)
              BUILD_VERSION="${GITHUB_REF_NAME#v}"
              VERSION="$BUILD_VERSION"
              # A numeric suffix identifies a rebuild of the same upstream version.
              if [[ "$VERSION" =~ -[0-9]+$ ]]; then
                VERSION="${VERSION%-*}"
              fi
              echo "is_preview=false"
              echo "release_tag=$GITHUB_REF_NAME"
              echo "tmux_version=$VERSION"
              echo "tmux_reported_version=$BUILD_VERSION+$GITHUB_REPOSITORY_OWNER"
              ;;
            schedule|workflow_dispatch)
              echo "is_preview=true"
              echo "release_tag=preview"
              echo "tmux_version=preview"
              ;;
          esac >> "$GITHUB_OUTPUT"

      - name: Get tmux upstream HEAD SHA
        id: tmux_head
        if: ${{ steps.meta.outputs.is_preview == 'true' }}
        run: |
          git clone --depth 1 https://github.com/tmux/tmux.git
          cd tmux
          HEAD_SHA=$(git rev-parse HEAD)
          echo "upstream_head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Determine if build is needed
        if: ${{ steps.meta.outputs.is_preview == 'true' }}
        id: check_changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.tmux_head.outputs.upstream_head_sha }}
        run: |
          LAST_SHA=""

          gh release download preview \
            --repo "$GITHUB_REPOSITORY" \
            --pattern tmux-upstream-sha.txt \
            --output last-sha.txt \
            >/dev/null 2>&1 || true

          [ -f last-sha.txt ] && LAST_SHA="$(< last-sha.txt)"

          echo "Last built SHA: $LAST_SHA"
          echo "Current HEAD SHA: $HEAD_SHA"

          if [ "$HEAD_SHA" = "$LAST_SHA" ]; then
            echo "No changes since last preview build, skipping."
            echo "upstream_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "New commit detected, building..."
            echo "upstream_changed=true" >> "$GITHUB_OUTPUT"
          fi


  build:
    name: Build tmux (${{ matrix.os }}-${{ matrix.arch }})
    needs: setup
    if: ${{ needs.setup.outputs.is_preview == 'false' || needs.setup.outputs.upstream_changed == 'true' }}
    env:
      TMUX_VERSION: ${{ needs.setup.outputs.tmux_version }}
      TMUX_REPORTED_VERSION: ${{ needs.setup.outputs.tmux_reported_version }}
      TMUX_UPSTREAM_SHA: ${{ needs.setup.outputs.upstream_head_sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runs_on: ubuntu-24.04
          - os: linux
            arch: arm64
            runs_on: ubuntu-24.04-arm
          - os: macos
            arch: x86_64
            runs_on: macos-15-intel
          - os: macos
            arch: arm64
            runs_on: macos-15


    runs-on: ${{ matrix.runs_on }}
    steps:
      - name: Install build dependencies (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              automake \
              bison \
              build-essential \
              git \
              tar \
              pkg-config \
              wget

      - name: Install build dependencies (macOS)
        if: matrix.os == 'macos'
        run: |
          brew update
          brew install \
              automake \
              bison

      - name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set versions
        run: |
          echo "Loading versions from versions.env"
          source versions.env
          {
            echo "MUSL_VERSION=$MUSL_VERSION"
            echo "LIBEVENT_VERSION=$LIBEVENT_VERSION"
            echo "NCURSES_VERSION=$NCURSES_VERSION"
            echo "UTF8PROC_VERSION=$UTF8PROC_VERSION"
          } >> "$GITHUB_ENV"

      - name: Build musl
        if: matrix.os == 'linux'
        run: |
          ./scripts/build_musl.sh
          echo "CC=${PREFIX}/bin/musl-gcc -static" >> "$GITHUB_ENV"

      - name: Build libevent
        run: ./scripts/build_libevent.sh

      - name: Build ncurses
        run: ./scripts/build_ncurses.sh

      - name: Build utf8proc
        if: matrix.os == 'macos'
        run: ./scripts/build_utf8proc.sh

      - name: Build tmux
        run: ./scripts/build_tmux.sh

      - name: Determine archive name
        id: archive_name
        run: |
          if [ "$TMUX_VERSION" = "preview" ]; then
            VERSION="$(date +%Y%m%d)-${TMUX_UPSTREAM_SHA:0:8}"
          else
            VERSION="$TMUX_VERSION"
          fi
          echo "archive_name=tmux-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Archive tmux binary
        env:
          ARCHIVE: ${{ steps.archive_name.outputs.archive_name }}
        run: |
          tar -czf "$ARCHIVE" -C "$PREFIX/bin" tmux

      - name: Verify archived tmux binary
        env:
          ARCHIVE: ${{ steps.archive_name.outputs.archive_name }}
        run: |
          VERIFY_PREFIX="$RUNNER_TEMP/tmux-verify"
          mkdir -p "$VERIFY_PREFIX/bin"
          tar -xzf "$ARCHIVE" -C "$VERIFY_PREFIX/bin"
          PREFIX="$VERIFY_PREFIX" ./scripts/verify_tmux.sh

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.archive_name.outputs.archive_name }}
          path: ${{ steps.archive_name.outputs.archive_name }}


  collect-licenses:
    runs-on: ubuntu-latest
    needs: setup
    if: ${{ needs.setup.outputs.is_preview == 'false' || needs.setup.outputs.upstream_changed == 'true' }}
    env:
      TMUX_VERSION: ${{ needs.setup.outputs.tmux_version }}
      TMUX_UPSTREAM_SHA: ${{ needs.setup.outputs.upstream_head_sha }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Collect licenses
        run: |
          ./scripts/collect_licenses.sh

      - name: Upload licenses artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LICENSES.tar.gz
          path: ${{ env.PREFIX }}/LICENSES.tar.gz


  create-release:
    needs: [setup, build, collect-licenses]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
      TMUX_VERSION: ${{ needs.setup.outputs.tmux_version }}
      IS_PREVIEW: ${{ needs.setup.outputs.is_preview }}
      TMUX_UPSTREAM_SHA: ${{ needs.setup.outputs.upstream_head_sha }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: dist

      - name: Write upstream SHA artifact
        if: ${{ needs.setup.outputs.is_preview == 'true' }}
        run: |
          echo "$TMUX_UPSTREAM_SHA" > dist/tmux-upstream-sha.txt

      - name: Write SHA256 checksums
        working-directory: dist
        run: sha256sum tmux-*.tar.gz LICENSES.tar.gz > SHA256SUMS

      - name: Create release
        run: |-
          RELEASE_FLAGS=()
          if [ "$IS_PREVIEW" = "true" ]; then
            TITLE="tmux preview build (${TMUX_UPSTREAM_SHA:0:8})"
            NOTES="Sixel-enabled builds from upstream tmux commit ${TMUX_UPSTREAM_SHA} for Linux (musl) and macOS."
            RELEASE_FLAGS+=(--prerelease)
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes || true
          else
            TITLE="tmux $RELEASE_TAG"
            NOTES="Sixel-enabled builds of tmux version $TMUX_VERSION for Linux (musl) and macOS."
            RELEASE_FLAGS+=(--verify-tag)
          fi

          gh release create "$RELEASE_TAG" \
            "${RELEASE_FLAGS[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --notes "$NOTES" \
            dist/*

