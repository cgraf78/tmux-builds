name: create-release

on:
  # Create a stable release
  push:
    tags:
      - 'v*'
  # Verify builds daily and publish newly available upstream stable releases.
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

env:
  PREFIX: /tmp/build

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      tmux_version: ${{ steps.meta.outputs.tmux_version }}
      tmux_reported_version: ${{ steps.meta.outputs.tmux_reported_version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      upstream_head_sha: ${{ steps.tmux_head.outputs.upstream_head_sha }}
      build_sha: ${{ steps.meta.outputs.build_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Test release selection
        run: bash tests/release_policy.sh

      - name: Compute metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG=""
          BUILD_SHA="$GITHUB_SHA"
          case "$GITHUB_EVENT_NAME" in
            push)
              RELEASE_TAG="$GITHUB_REF_NAME"
              ;;
            schedule)
              source scripts/release_policy.sh
              UPSTREAM_TAG=$(latest_upstream_tag)
              if [[ -n "$UPSTREAM_TAG" ]]; then
                COVERED=$(version_covered "$GITHUB_REPOSITORY" "$UPSTREAM_TAG")
                if [[ "$COVERED" == false ]]; then
                  RELEASE_TAG="$UPSTREAM_TAG-1"
                  TAG_SHA=$(release_tag_commit "$GITHUB_REPOSITORY" "$RELEASE_TAG")
                  BUILD_SHA="${TAG_SHA:-$BUILD_SHA}"
                fi
              fi
              ;;
          esac

          {
            echo "release_tag=$RELEASE_TAG"
            echo "build_sha=$BUILD_SHA"
            if [[ -n "$RELEASE_TAG" ]]; then
              BUILD_VERSION="${RELEASE_TAG#v}"
              VERSION="$BUILD_VERSION"
              # A numeric suffix identifies a rebuild of the same upstream version.
              if [[ "$VERSION" =~ -[0-9]+$ ]]; then
                VERSION="${VERSION%-*}"
              fi
              echo "is_preview=false"
              echo "tmux_version=$VERSION"
              echo "tmux_reported_version=$BUILD_VERSION+$GITHUB_REPOSITORY_OWNER"
            elif [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
              VERSION=3.8
              echo "is_preview=false"
              echo "tmux_version=$VERSION"
              echo "tmux_reported_version=$VERSION-0+$GITHUB_REPOSITORY_OWNER"
            else
              echo "is_preview=true"
              echo "tmux_version=preview"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Get tmux upstream HEAD SHA
        id: tmux_head
        if: ${{ steps.meta.outputs.is_preview == 'true' }}
        run: |
          git clone --depth 1 https://github.com/tmux/tmux.git
          cd tmux
          HEAD_SHA=$(git rev-parse HEAD)
          echo "Building upstream tmux commit $HEAD_SHA"
          echo "upstream_head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"


  build:
    name: Build tmux (${{ matrix.os }}-${{ matrix.arch }})
    needs: setup
    env:
      TMUX_VERSION: ${{ needs.setup.outputs.tmux_version }}
      TMUX_REPORTED_VERSION: ${{ needs.setup.outputs.tmux_reported_version }}
      TMUX_UPSTREAM_SHA: ${{ needs.setup.outputs.upstream_head_sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runs_on: ubuntu-24.04
          - os: linux
            arch: arm64
            runs_on: ubuntu-24.04-arm
          - os: macos
            arch: x86_64
            runs_on: macos-15-intel
          - os: macos
            arch: arm64
            runs_on: macos-15


    runs-on: ${{ matrix.runs_on }}
    steps:
      - name: Install build dependencies (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              automake \
              bison \
              build-essential \
              git \
              tar \
              pkg-config \
              wget

      - name: Install build dependencies (macOS)
        if: matrix.os == 'macos'
        run: |
          brew update
          brew install \
              automake \
              bison

      - name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.setup.outputs.build_sha }}
          persist-credentials: false

      - name: Set versions
        run: |
          echo "Loading versions from versions.env"
          source versions.env
          {
            echo "MUSL_VERSION=$MUSL_VERSION"
            echo "LIBEVENT_VERSION=$LIBEVENT_VERSION"
            echo "NCURSES_VERSION=$NCURSES_VERSION"
            echo "UTF8PROC_VERSION=$UTF8PROC_VERSION"
            echo "ZLIB_VERSION=$ZLIB_VERSION"
          } >> "$GITHUB_ENV"

      - name: Build musl
        if: matrix.os == 'linux'
        run: |
          ./scripts/build_musl.sh
          echo "CC=${PREFIX}/bin/musl-gcc -static" >> "$GITHUB_ENV"

      - name: Build zlib
        # The musl linker needs its own zlib when tmux enables image support.
        if: matrix.os == 'linux'
        run: ./scripts/build_zlib.sh

      - name: Build libevent
        run: ./scripts/build_libevent.sh

      - name: Build ncurses
        run: ./scripts/build_ncurses.sh

      - name: Build utf8proc
        if: matrix.os == 'macos'
        run: ./scripts/build_utf8proc.sh

      - name: Build tmux
        run: ./scripts/build_tmux.sh

      - name: Determine archive name
        id: archive_name
        run: |
          if [ "$TMUX_VERSION" = "preview" ]; then
            VERSION="$(date +%Y%m%d)-${TMUX_UPSTREAM_SHA:0:8}"
          else
            VERSION="$TMUX_VERSION"
          fi
          echo "archive_name=tmux-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Archive tmux binary
        env:
          ARCHIVE: ${{ steps.archive_name.outputs.archive_name }}
        run: |
          tar -czf "$ARCHIVE" -C "$PREFIX/bin" tmux

      - name: Verify archived tmux binary
        env:
          ARCHIVE: ${{ steps.archive_name.outputs.archive_name }}
        run: |
          VERIFY_PREFIX="$RUNNER_TEMP/tmux-verify"
          mkdir -p "$VERIFY_PREFIX/bin"
          tar -xzf "$ARCHIVE" -C "$VERIFY_PREFIX/bin"
          PREFIX="$VERIFY_PREFIX" ./scripts/verify_tmux.sh

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.archive_name.outputs.archive_name }}
          path: ${{ steps.archive_name.outputs.archive_name }}


  collect-licenses:
    runs-on: ubuntu-latest
    needs: setup
    env:
      TMUX_VERSION: ${{ needs.setup.outputs.tmux_version }}
      TMUX_UPSTREAM_SHA: ${{ needs.setup.outputs.upstream_head_sha }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.setup.outputs.build_sha }}
          persist-credentials: false

      - name: Collect licenses
        run: |
          ./scripts/collect_licenses.sh

      - name: Upload licenses artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LICENSES.tar.gz
          path: ${{ env.PREFIX }}/LICENSES.tar.gz


  create-release:
    needs: [setup, build, collect-licenses]
    if: >-
      ${{ needs.setup.outputs.release_tag != '' &&
          (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref_type == 'tag')) }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ needs.setup.outputs.release_tag }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
      TMUX_VERSION: ${{ needs.setup.outputs.tmux_version }}
      BUILD_SHA: ${{ needs.setup.outputs.build_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: github.event_name == 'schedule'
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: dist

      - name: Write SHA256 checksums
        working-directory: dist
        run: sha256sum tmux-*.tar.gz LICENSES.tar.gz > SHA256SUMS

      - name: Create release
        run: |-
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            source scripts/release_policy.sh
            UPSTREAM_TAG=$(latest_upstream_tag)
            if [[ "$UPSTREAM_TAG" != "v$TMUX_VERSION" ]]; then
              echo "tmux $TMUX_VERSION is no longer the latest upstream stable release."
              exit 0
            fi
            COVERED=$(version_covered "$GITHUB_REPOSITORY" "$UPSTREAM_TAG")
            if [[ "$COVERED" == true ]]; then
              echo "A downstream release now covers tmux $TMUX_VERSION."
              exit 0
            fi

            # Pin the tag to the commit that produced these archives, even if main moved.
            TAG_SHA=$(release_tag_commit "$GITHUB_REPOSITORY" "$RELEASE_TAG")
            if [[ -z "$TAG_SHA" ]]; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$RELEASE_TAG" -f sha="$BUILD_SHA" --silent
            elif [[ "$TAG_SHA" != "$BUILD_SHA" ]]; then
              echo "Release tag $RELEASE_TAG moved while this build was running." >&2
              exit 1
            fi
          fi

          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --repo "$GITHUB_REPOSITORY" \
            --title "tmux $RELEASE_TAG" \
            --notes "Sixel-enabled builds of tmux version $TMUX_VERSION for Linux (musl) and macOS." \
            dist/*

